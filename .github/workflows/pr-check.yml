# The description a pull request needs before it can be merged (CONTRIBUTING.md, "What a PR
# needs to be merged"): the Tested / Not tested / AI use sections, and – when it changes the
# runtime (crates/xcl/src outside tests) – two `xcl-smoke` blocks from scripts/smoke.ps1, one of
# them made on the PR's head commit with no uncommitted changes. AI use must not name a small or
# open-weight model (CONTRIBUTING.md, "AI-assisted contributions"). Runs again when the
# description is edited or a commit is pushed.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  description:
    name: PR description
    # Dependabot cannot write the Tested / Not tested / AI use sections; a skipped job passes the required check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the description
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename' > files.txt
          python3 - <<'EOF'
          import os, re, sys
          body = (os.environ.get("BODY") or "").replace("\r\n", "\n")
          head = os.environ["HEAD"]
          files = open("files.txt").read().split()
          problems = []
          for section in ("Tested", "Not tested", "AI use"):
              if not re.search(r"\*\*" + section + r"\*\*\s*\n\s*\S", body):
                  problems.append(f"the **{section}** section is missing or empty")
          def runtime(f):
              return f.startswith("crates/xcl/src/") and "/tests" not in f and not f.endswith("tests.rs")
          if any(runtime(f) for f in files):
              blocks = re.findall(r"xcl-smoke v1\s*\ncommit: (\S+)(.*)", body)
              if len(blocks) < 2:
                  problems.append("the PR changes the runtime: **Regression run** needs two `xcl-smoke` blocks "
                                  "(scripts/smoke.ps1 built from main and from this PR's head commit)")
              elif not any(head.startswith(c) and "uncommitted" not in rest for c, rest in blocks):
                  problems.append(f"no `xcl-smoke` block was made on this PR's head commit {head[:12]} without "
                                  "uncommitted changes - rerun scripts/smoke.ps1 after the last push")
              for key in ("device removals", "crashes"):
                  for n in re.findall(key + r": (\d+)", body):
                      if int(n) > 0:
                          problems.append(f"a regression run shows {key}: {n}")
          # small / open-weight models are not accepted (CONTRIBUTING.md, "AI-assisted contributions")
          ai = re.search(r"\*\*AI use\*\*(.*?)(\n\*\*|\Z)", body, re.S)
          banned = re.findall(r"\b(qwen|deepseek|llama|mistral|mixtral|gemma|phi-?\d)", ai.group(1), re.I) if ai else []
          if banned:
              problems.append("**AI use** names a model this repository does not accept for code ("
                              + ", ".join(sorted({b.lower() for b in banned})) + "): see CONTRIBUTING.md")
          if problems:
              print("This PR cannot be merged yet (see CONTRIBUTING.md, 'What a PR needs to be merged'):")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("description ok")
          EOF
