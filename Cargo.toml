[workspace]
resolver = "2"
members = ["crates/xcl", "tests/testtitle", "tests/testgamedll"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

# Clippy lints that fire on the tree today (count: warnings by file and line), allowed so CI
# can deny new kinds. Remove a line once its warnings are fixed.
[workspace.lints.clippy]
missing_safety_doc = "allow"                # 310
manual_c_str_literals = "allow"             # 70
needless_range_loop = "allow"               # 40
identity_op = "allow"                       # 32
manual_is_multiple_of = "allow"             # 29
type_complexity = "allow"                   # 29
chunks_exact_to_as_chunks = "allow"         # 16
missing_transmute_annotations = "allow"     # 10
too_many_arguments = "allow"                # 10
unnecessary_sort_by = "allow"               # 9
doc_lazy_continuation = "allow"             # 8
neg_cmp_op_on_partial_ord = "allow"         # 6
double_comparisons = "allow"                # 5
manual_dangling_ptr = "allow"               # 4
unusual_byte_groupings = "allow"            # 4
upper_case_acronyms = "allow"               # 4
useless_vec = "allow"                       # 4
field_reassign_with_default = "allow"       # 3
manual_div_ceil = "allow"                   # 3
precedence = "allow"                        # 3
unnecessary_cast = "allow"                  # 3
while_let_loop = "allow"                    # 3
manual_contains = "allow"                   # 2
needless_borrows_for_generic_args = "allow" # 2
cast_slice_from_raw_parts = "allow"         # 1
cmp_owned = "allow"                         # 1
declare_interior_mutable_const = "allow"    # 1
forget_non_drop = "allow"                   # 1
if_same_then_else = "allow"                 # 1
io_other_error = "allow"                    # 1
items_after_test_module = "allow"           # 1
large_enum_variant = "allow"                # 1
manual_isolate_lowest_one = "allow"         # 1
manual_repeat_n = "allow"                   # 1
manual_unwrap_or = "allow"                  # 1
map_entry = "allow"                         # 1
map_identity = "allow"                      # 1
needless_borrow = "allow"                   # 1
needless_lifetimes = "allow"                # 1
needless_return = "allow"                   # 1
question_mark = "allow"                     # 1
redundant_closure = "allow"                 # 1
same_item_push = "allow"                    # 1
unnecessary_map_or = "allow"                # 1
useless_format = "allow"                    # 1
